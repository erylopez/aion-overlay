# Windows installer: per-user NSIS (no admin rights), like marnis-app's.
#
#   npm run dist      -> dist/Nyerk-Setup-<version>.exe
#
# The tracker helper is the PyInstaller build in ../build/sidecar/aion2-tracker (npm run dist builds
# it first: scripts/build-sidecar.mjs). Npcap is not bundled: its licence does not allow it, and
# the app tells the user to install it.
# appId, executableName and the package name (the install folder) are kept from the first release:
# the updater and the installed copy are found by them. The product name was renamed in 0.1.11.
appId: com.xcrov.aion2-drop-tracker
productName: Nyerk
executableName: Aion2DropTracker
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../build/sidecar/aion2-tracker
    to: sidecar
    filter: ['**/*']
asar: true
electronLanguages: [en-US]
win:
  target: [nsis]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Nyerk
  artifactName: Nyerk-Setup-${version}.${ext}
# The update feed. electron-builder bakes this into the build as app-update.yml; `npm run dist`
# publishes nothing itself (--publish never).
publish:
  provider: generic
  url: https://nyerk.app/updates/
  channel: latest
